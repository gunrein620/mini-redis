<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini-redis — DBMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        *, *::before, *::after { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', system-ui, sans-serif; background: #f0f6ff; color: #1a1a2e; margin: 0; }

        @keyframes fade-up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fade-up 0.8s cubic-bezier(0.25, 1, 0.5, 1) both; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(0,0,0,0.1); border-top-color: #0A84FF;
            border-radius: 50%; animation: spin 0.6s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .terminal-window {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            color: #1a1a2e;
        }

        .btn {
            border-radius: 980px;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 20px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: scale(0.98); }

        .btn-get {
            background: rgba(139, 92, 246, 0.10);
            color: #7c3aed;
            border-color: rgba(139, 92, 246, 0.14);
        }
        .btn-get:hover { background: rgba(139, 92, 246, 0.16); }

        .btn-set {
            background: rgba(16, 185, 129, 0.10);
            color: #059669;
            border-color: rgba(16, 185, 129, 0.14);
        }
        .btn-set:hover { background: rgba(16, 185, 129, 0.16); }

        .btn-del {
            background: rgba(220, 38, 38, 0.10);
            color: #b42318;
            border-color: rgba(220, 38, 38, 0.14);
        }
        .btn-del:hover { background: rgba(220, 38, 38, 0.16); }

        .btn-keys {
            background: rgba(37, 99, 235, 0.10);
            color: #1d4ed8;
            border-color: rgba(37, 99, 235, 0.14);
        }
        .btn-keys:hover { background: rgba(37, 99, 235, 0.16); }

        .btn-flush {
            background: rgba(255,255,255,0.82);
            color: #475569;
            border-color: rgba(71, 85, 105, 0.16);
            border-radius: 980px;
            font-weight: 700;
            font-size: 13px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-flush:hover { background: rgba(255,255,255,0.95); color: #334155; }
        .btn-flush:active { transform: scale(0.98); }

        .btn-text { color: #0A84FF; font-weight: 600; font-size: 15px; background: none; border: none; cursor: pointer; transition: color 0.2s; }
        .btn-text:hover { color: #006ee6; }

        .input-field {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 12px;
            padding: 0.6rem 0.85rem;
            color: #1a1a2e;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .input-field:focus { border-color: rgba(10, 132, 255, 0.4); }
        .input-field::placeholder { color: #9ca3af; }

        .key-row {
            padding: 0.55rem 0.85rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            color: #1a1a2e;
        }
        .key-row:hover { background: rgba(10, 132, 255, 0.04); }
        .key-row:last-child { border-bottom: none; }
        .key-row.selected { background: rgba(10, 132, 255, 0.08); }

        .ttl-badge {
            display: inline-block; padding: 0.12rem 0.45rem; border-radius: 6px;
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em;
        }
        .ttl-badge.ttl { background: rgba(217, 119, 6, 0.1); color: #d97706; border: 1px solid rgba(217, 119, 6, 0.15); }
        .ttl-badge.persistent { background: rgba(10, 132, 255, 0.1); color: #0A84FF; border: 1px solid rgba(10, 132, 255, 0.15); }

        .log-item {
            padding: 0.5rem 0.7rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 0.78rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-item:last-child { border-bottom: none; }
        .log-item .log-cmd { color: #6b7280; font-family: 'SF Mono', 'Consolas', monospace; flex: 1; }
        .log-item .log-time { color: #d97706; font-size: 0.72rem; font-weight: 600; white-space: nowrap; margin-left: 0.5rem; font-family: 'SF Mono', monospace; }
        .log-item.success .log-cmd { color: #22a352; }
        .log-item.fail .log-cmd { color: #e63939; }

        .detail-panel {
            margin-top: 0.5rem; padding: 0.85rem; border-radius: 14px;
            background: rgba(10, 132, 255, 0.04);
            border: 1px solid rgba(10, 132, 255, 0.08);
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 50;
        }
        .modal-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 1.5rem;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

        @media (max-width: 480px) {
            .ops-grid { grid-template-columns: repeat(2, 1fr) !important; }
        }
    </style>
</head>
<body>

    <div class="relative max-w-[680px] mx-auto px-6">

        <!-- Header -->
        <section class="pt-24 pb-16 text-center fade-up">
            <div class="flex items-center justify-center mb-5">
                <div class="relative">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#0A84FF] to-[#38bdf8] flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
                        </svg>
                    </div>
                    <div id="status-dot" class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-red-400 rounded-full border-2 border-[#f0f6ff] transition-colors duration-300"></div>
                </div>
            </div>
            <p class="text-[#0A84FF] text-sm font-semibold tracking-wide mb-4">Mini Redis Project</p>
            <h1 class="text-5xl sm:text-6xl font-bold tracking-tight leading-[1.08] text-[#1a1a2e] mb-5">
                Redis DBMS<br>
                <span class="bg-gradient-to-r from-[#0A84FF] to-[#38bdf8] bg-clip-text text-transparent">실시간으로 관리하세요.</span>
            </h1>
            <p class="text-lg text-[#6b7280] leading-relaxed max-w-md mx-auto">
                Redis 명령어를 직접 실행하고<br>키의 상태를 실시간으로 확인합니다.
            </p>
            <p id="status-text" class="mt-3 text-xs text-red-400/70 transition-colors duration-300">Disconnected</p>
        </section>

        <!-- Dashboard Stats -->
        <section class="mb-8 fade-up" style="animation-delay: 0.1s;">
            <div class="glass-panel">
                <div class="grid grid-cols-3 divide-x divide-black/[0.04]">
                    <div class="p-5 text-center">
                        <div class="text-xs font-semibold text-[#6b7280] tracking-[0.15em] mb-2">DB SIZE</div>
                        <span class="text-3xl font-bold text-[#1a1a2e] tabular-nums" id="stat-total">-</span>
                    </div>
                    <div class="p-5 text-center">
                        <div class="text-xs font-semibold text-[#d97706] tracking-[0.15em] mb-2">TTL KEYS</div>
                        <span class="text-3xl font-bold text-[#1a1a2e] tabular-nums" id="stat-ttl">-</span>
                    </div>
                    <div class="p-5 text-center">
                        <div class="text-xs font-semibold text-[#0A84FF] tracking-[0.15em] mb-2">PERSISTENT</div>
                        <span class="text-3xl font-bold text-[#1a1a2e] tabular-nums" id="stat-persistent">-</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Operations Panel -->
        <section class="mb-8 fade-up" style="animation-delay: 0.15s;">
            <div class="glass-panel p-5">
                <div class="grid grid-cols-3 gap-2.5 mb-3">
                    <input type="text" id="input-key" class="input-field" placeholder="key">
                    <input type="text" id="input-value" class="input-field" placeholder="value">
                    <input type="number" id="input-ttl" class="input-field" placeholder="TTL (초)">
                </div>
                <div class="grid grid-cols-4 gap-2.5 mb-3 ops-grid">
                    <button onclick="execGet()" class="btn btn-get">GET</button>
                    <button onclick="execSet()" class="btn btn-set">SET</button>
                    <button onclick="execDelete()" class="btn btn-del">DEL</button>
                    <button onclick="execKeys()" class="btn btn-keys">KEYS</button>
                </div>
                <button onclick="execFlushAll()" class="btn-flush w-full">FLUSH ALL</button>
                <div id="op-result" class="mt-3 text-sm min-h-[24px] font-mono"></div>
            </div>
        </section>

        <!-- Key Browser -->
        <section class="mb-8 fade-up" style="animation-delay: 0.2s;">
            <div class="terminal-window">
                <div class="flex items-center justify-between px-5 py-3 border-b border-black/[0.06]">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-[#6b7280] font-semibold">Key Browser</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#0A84FF]/10 text-[#0A84FF]" id="key-count">0</span>
                    </div>
                    <button onclick="refreshKeys()" class="btn-text text-xs inline-flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        Refresh
                    </button>
                </div>
                <div id="key-list" class="max-h-[320px] overflow-y-auto">
                    <p class="text-center text-sm text-[#9ca3af] py-6">키가 없습니다</p>
                </div>
                <div id="key-detail" class="hidden"></div>
            </div>
        </section>

        <!-- Command Log -->
        <section class="mb-12 fade-up" style="animation-delay: 0.25s;">
            <div class="terminal-window">
                <div class="flex items-center justify-center px-4 py-3 border-b border-black/[0.06]">
                    <span class="text-xs text-[#6b7280] font-semibold">Command Log <span id="log-count">(0/20)</span></span>
                </div>
                <div class="px-3 py-2 max-h-[240px] overflow-y-auto" id="log-list">
                    <p class="text-center text-sm text-[#9ca3af] py-4">아직 기록이 없습니다</p>
                </div>
            </div>
        </section>

        <!-- Navigation -->
        <div class="flex justify-center gap-8 pb-16 fade-up" style="animation-delay: 0.3s;">
            <a href="../" class="btn-text inline-flex items-center gap-1.5 text-base">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                쿠폰 데모
            </a>
            <a href="../mc-frontend/" class="btn-text inline-flex items-center gap-1.5 text-base">
                쿠폰 TTL 데모
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>
        </div>

    </div>

    <!-- Confirm Modal -->
    <div id="modal" class="modal-overlay hidden">
        <div class="modal-box">
            <p id="modal-msg" class="text-sm text-[#1a1a2e] mb-5"></p>
            <div class="flex gap-2.5 justify-center">
                <button id="modal-cancel" onclick="closeModal()" class="btn" style="background:rgba(255,255,255,0.82);color:#475569;border-color:rgba(71,85,105,0.16);padding:10px 24px;font-size:14px;">취소</button>
                <button id="modal-confirm" class="btn btn-del" style="padding:10px 24px;">확인</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
