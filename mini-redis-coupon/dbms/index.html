<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Redis DBMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"SF Mono"', '"Consolas"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        @keyframes fade-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fade-up 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes pulse-glow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
        .glass-strong { background: rgba(255,255,255,0.06); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.1); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.2); border-top-color: #a78bfa;
            border-radius: 50%; animation: spin 0.6s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }

        .input-field {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 0.55rem 0.75rem; color: rgba(255,255,255,0.85);
            font-size: 0.85rem; outline: none; width: 100%;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: rgba(139,92,246,0.5); }
        .input-field::placeholder { color: rgba(255,255,255,0.2); }

        .key-row {
            padding: 0.5rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: background 0.15s;
        }
        .key-row:hover { background: rgba(255,255,255,0.04); }
        .key-row:last-child { border-bottom: none; }
        .key-row.selected { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.15); }

        .ttl-badge {
            display: inline-block; padding: 0.1rem 0.4rem; border-radius: 6px;
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em;
        }
        .ttl-badge.ttl { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
        .ttl-badge.persistent { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.2); }

        .log-item {
            padding: 0.45rem 0.65rem; border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center;
        }
        .log-item:last-child { border-bottom: none; }
        .log-item .log-cmd { color: rgba(255,255,255,0.5); font-family: 'SF Mono', 'Consolas', monospace; flex: 1; }
        .log-item .log-time { color: #fbbf24; font-size: 0.72rem; white-space: nowrap; margin-left: 0.5rem; }
        .log-item.success .log-cmd { color: #4ade80; }
        .log-item.fail .log-cmd { color: #f87171; }

        .detail-panel {
            margin-top: 0.5rem; padding: 0.75rem; border-radius: 12px;
            background: rgba(139,92,246,0.05); border: 1px solid rgba(139,92,246,0.1);
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 50;
        }
        .modal-box {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 1.5rem; max-width: 360px; width: 90%;
            text-align: center;
        }
    </style>
</head>
<body class="bg-[#0a0a0f] text-white font-sans min-h-screen overflow-x-hidden">

    <!-- 배경 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-[500px] h-[500px] bg-violet-600/15 rounded-full blur-[120px] animate-pulse-glow"></div>
        <div class="absolute top-1/4 -right-20 w-[400px] h-[400px] bg-indigo-500/10 rounded-full blur-[100px] animate-pulse-glow" style="animation-delay: 1s;"></div>
        <div class="absolute bottom-0 left-1/3 w-[350px] h-[350px] bg-fuchsia-500/8 rounded-full blur-[100px] animate-pulse-glow" style="animation-delay: 2s;"></div>
        <div class="absolute inset-0 opacity-[0.02]" style="background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 60px 60px;"></div>
    </div>

    <div class="relative max-w-3xl mx-auto px-5 py-10">

        <!-- Header -->
        <header class="mb-10 animate-fade-up">
            <div class="flex items-center gap-3 mb-4">
                <a href="http://localhost:3000" class="relative group flex-shrink-0 cursor-pointer">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-violet-500/25 group-hover:shadow-violet-500/40 transition-shadow duration-200">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
                        </svg>
                    </div>
                    <div id="status-dot" class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-red-400 rounded-full border-2 border-[#0a0a0f] transition-colors duration-300"></div>
                </a>
                <div>
                    <p class="text-[10px] font-bold tracking-[0.2em] uppercase text-violet-400/80">Mini Redis</p>
                    <h1 class="text-2xl font-bold tracking-tight text-white/95">DBMS</h1>
                </div>
                <span id="status-text" class="ml-auto text-xs text-red-400/70 transition-colors duration-300">Disconnected</span>
            </div>
        </header>

        <!-- Dashboard Stats -->
        <section class="mb-8 animate-fade-up" style="animation-delay: 0.05s;">
            <p class="text-xs font-bold tracking-[0.15em] uppercase text-white/30 mb-3">Dashboard</p>
            <div class="grid grid-cols-3 gap-3">
                <div class="glass rounded-2xl p-4 text-center">
                    <span class="text-[10px] font-bold tracking-[0.15em] uppercase text-violet-400/70 block mb-1">DB Size</span>
                    <span class="text-2xl font-bold text-white/90 tabular-nums" id="stat-total">-</span>
                </div>
                <div class="glass rounded-2xl p-4 text-center">
                    <span class="text-[10px] font-bold tracking-[0.15em] uppercase text-amber-400/70 block mb-1">TTL Keys</span>
                    <span class="text-2xl font-bold text-white/90 tabular-nums" id="stat-ttl">-</span>
                </div>
                <div class="glass rounded-2xl p-4 text-center">
                    <span class="text-[10px] font-bold tracking-[0.15em] uppercase text-indigo-400/70 block mb-1">Persistent</span>
                    <span class="text-2xl font-bold text-white/90 tabular-nums" id="stat-persistent">-</span>
                </div>
            </div>
        </section>

        <!-- Operations Panel -->
        <section class="mb-8 animate-fade-up" style="animation-delay: 0.1s;">
            <p class="text-xs font-bold tracking-[0.15em] uppercase text-white/30 mb-3">Operations</p>
            <div class="glass rounded-2xl p-5">
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <input type="text" id="input-key" class="input-field col-span-1" placeholder="key">
                    <input type="text" id="input-value" class="input-field col-span-1" placeholder="value">
                    <input type="number" id="input-ttl" class="input-field col-span-1" placeholder="TTL (초)">
                </div>
                <div class="grid grid-cols-4 gap-2 mb-3">
                    <button onclick="execGet()" class="py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 active:scale-[0.97] transition-all duration-200">GET</button>
                    <button onclick="execSet()" class="py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 active:scale-[0.97] transition-all duration-200">SET</button>
                    <button onclick="execDelete()" class="py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-rose-600 to-red-500 hover:from-rose-500 hover:to-red-400 active:scale-[0.97] transition-all duration-200">DEL</button>
                    <button onclick="execKeys()" class="py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-blue-600 to-indigo-500 hover:from-blue-500 hover:to-indigo-400 active:scale-[0.97] transition-all duration-200">KEYS</button>
                </div>
                <button onclick="execFlushAll()" class="w-full py-2 rounded-xl text-xs font-semibold glass-strong hover:border-white/20 text-white/40 active:scale-[0.97] transition-all duration-200">FLUSH ALL</button>
                <div id="op-result" class="mt-3 text-sm min-h-[24px]"></div>
            </div>
        </section>

        <!-- Key Browser -->
        <section class="mb-8 animate-fade-up" style="animation-delay: 0.15s;">
            <div class="flex items-center gap-2 mb-3">
                <p class="text-xs font-bold tracking-[0.15em] uppercase text-white/30">Key Browser</p>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-violet-500/15 text-violet-400 border border-violet-500/20" id="key-count">0</span>
                <button onclick="refreshKeys()" class="ml-auto text-xs text-white/30 hover:text-white/60 transition-colors">&#x21bb; Refresh</button>
            </div>
            <div class="glass rounded-2xl overflow-hidden">
                <div id="key-list" class="max-h-[320px] overflow-y-auto">
                    <p class="text-center text-sm text-white/20 py-6">키가 없습니다</p>
                </div>
                <div id="key-detail" class="hidden"></div>
            </div>
        </section>

        <!-- Command Log -->
        <section class="mb-8 animate-fade-up" style="animation-delay: 0.2s;">
            <div class="flex items-center gap-2 mb-3">
                <p class="text-xs font-bold tracking-[0.15em] uppercase text-white/30">Command Log</p>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-violet-500/15 text-violet-400 border border-violet-500/20" id="log-count">(0/20)</span>
            </div>
            <div class="glass rounded-2xl p-3 max-h-[240px] overflow-y-auto" id="log-list">
                <p class="text-center text-sm text-white/20 py-3">아직 기록이 없습니다</p>
            </div>
        </section>

    </div>

    <!-- Confirm Modal -->
    <div id="modal" class="modal-overlay hidden">
        <div class="modal-box">
            <p id="modal-msg" class="text-sm text-white/80 mb-4"></p>
            <div class="flex gap-2 justify-center">
                <button id="modal-cancel" onclick="closeModal()" class="px-5 py-2 rounded-xl text-sm glass-strong text-white/50 hover:text-white/80 transition-colors">취소</button>
                <button id="modal-confirm" class="px-5 py-2 rounded-xl text-sm bg-gradient-to-r from-rose-600 to-red-500 font-semibold active:scale-[0.97] transition-all">확인</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
