<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선착순 쿠폰 이벤트</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div>
                <p class="eyebrow">Mini Redis vs PostgreSQL</p>
                <h1>선착순 쿠폰 발급 이벤트</h1>
                <p class="subtitle">쿠폰 발급 결과를 확인하고, 보관함에서 남은 사용 시간을 바로 조회해보세요.</p>
            </div>
            <a class="vault-link" href="/coupon-checkout/" aria-label="쿠폰 보관함 확인하기">
                쿠폰 보관함 확인하기
            </a>
        </header>

        <section class="stock-section">
            <h2>남은 쿠폰 수량</h2>
            <div class="stock-display">
                <div class="stock-card">
                    <span class="stock-label">Redis 재고</span>
                    <span class="stock-value" id="redis-count">-</span>
                </div>
                <div class="stock-card">
                    <span class="stock-label">PostgreSQL 재고</span>
                    <span class="stock-value" id="db-count">-</span>
                </div>
            </div>
        </section>

        <section class="action-section">
            <button class="btn btn-redis" id="btn-redis" onclick="issueCouponRedis()">
                <span class="btn-icon-wrap" aria-hidden="true">
                    <img class="btn-icon" src="../wg/assets/redis.png" alt="">
                </span>
                <span class="btn-copy">
                    <span class="btn-title">Redis로 발급</span>
                    <span class="btn-subtitle">메모리 기반 빠른 발급</span>
                </span>
            </button>
            <button class="btn btn-db" id="btn-db" onclick="issueCouponDB()">
                <span class="btn-icon-wrap" aria-hidden="true">
                    <img class="btn-icon" src="../wg/assets/postgresql.png" alt="">
                </span>
                <span class="btn-copy">
                    <span class="btn-title">PostgreSQL로 발급</span>
                    <span class="btn-subtitle">DB 트랜잭션 기반 발급</span>
                </span>
            </button>
            <button class="btn btn-bulk" id="btn-bulk" onclick="bulkTest()">
                1000명 동시 요청 테스트
            </button>
            <button class="btn btn-reset" id="btn-reset" onclick="resetCoupon()">
                재고 초기화
            </button>
        </section>

        <section class="result-section">
            <div class="section-heading">
                <h2>발급 결과</h2>
                <p class="section-caption">발급이 성공하면 사용자 ID와 함께 쿠폰 보관함으로 이동할 수 있습니다.</p>
            </div>
            <div class="result-box" id="result-box">
                <p class="placeholder">발급 버튼을 눌러 쿠폰을 발급해보세요.</p>
            </div>
        </section>

        <section class="log-section">
            <h2>요청 기록 <span class="log-count" id="log-count">(0/10)</span></h2>
            <div class="log-list" id="log-list">
                <p class="placeholder">아직 요청 기록이 없습니다.</p>
            </div>
        </section>
    </div>

    <script src="../wg/coupon-storage.js"></script>
    <script src="../app.js"></script>
</body>
</html>
