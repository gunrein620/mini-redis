<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Redis - Coupon TTL Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        /* 애니메이션 */
        @keyframes fade-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fade-up 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.3s ease-out; }

        @keyframes scale-in { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .animate-scale-in { animation: scale-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes pulse-glow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }

        @keyframes particle-rise {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(0); }
        }

        /* 원형 타이머 */
        .circle-timer { transform: rotate(-90deg); }
        .circle-timer circle { transition: stroke-dashoffset 1s linear, stroke 0.5s ease; }

        /* 쿠폰 노치 */
        .coupon-notch-left { position: absolute; left: -12px; width: 24px; height: 24px; border-radius: 50%; background: #0a0a0f; }
        .coupon-notch-right { position: absolute; right: -12px; width: 24px; height: 24px; border-radius: 50%; background: #0a0a0f; }

        /* 글래스 */
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
        .glass-strong { background: rgba(255,255,255,0.06); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.1); }

        /* 스크롤바 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* 파티클 컨테이너 */
        #particles { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
    </style>
</head>
<body class="bg-[#0a0a0f] text-white font-sans min-h-screen overflow-x-hidden">

    <!-- 파티클 -->
    <div id="particles"></div>

    <!-- 배경 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-[500px] h-[500px] bg-violet-600/15 rounded-full blur-[120px] animate-pulse-glow"></div>
        <div class="absolute top-1/4 -right-20 w-[400px] h-[400px] bg-indigo-500/10 rounded-full blur-[100px] animate-pulse-glow" style="animation-delay: 1s;"></div>
        <div class="absolute bottom-0 left-1/3 w-[350px] h-[350px] bg-fuchsia-500/8 rounded-full blur-[100px] animate-pulse-glow" style="animation-delay: 2s;"></div>
        <!-- 그리드 오버레이 -->
        <div class="absolute inset-0 opacity-[0.02]" style="background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 60px 60px;"></div>
    </div>

    <div class="relative max-w-xl mx-auto px-5 py-10">

        <!-- 헤더 -->
        <header class="mb-10 animate-fade-up">
            <div class="flex items-center gap-3 mb-4">
                <div class="relative">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-violet-500/25">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/>
                        </svg>
                    </div>
                    <div class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-emerald-400 rounded-full border-2 border-[#0a0a0f] animate-pulse"></div>
                </div>
                <div>
                    <p class="text-[10px] font-bold tracking-[0.2em] uppercase text-violet-400/80">Mini Redis</p>
                    <h1 class="text-2xl font-bold tracking-tight text-white/95">Coupon TTL Demo</h1>
                </div>
            </div>
            <p class="text-sm text-white/35 leading-relaxed pl-[52px]">
                Redis TTL 기반 쿠폰 만료 시스템을 실시간으로 확인하세요
            </p>
        </header>

        <!-- 검색 바 -->
        <div class="relative mb-8 animate-fade-up" style="animation-delay: 0.1s;">
            <div class="flex gap-2.5">
                <div class="relative flex-1 group">
                    <div class="absolute inset-0 rounded-2xl bg-gradient-to-r from-violet-500/20 to-indigo-500/20 opacity-0 group-focus-within:opacity-100 blur-xl transition-opacity duration-500"></div>
                    <div class="relative">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/20 group-focus-within:text-violet-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <input
                            type="text"
                            id="user-id-input"
                            placeholder="사용자 ID를 입력하세요 (예: user01)"
                            autocomplete="off"
                            class="w-full pl-11 pr-4 py-4 rounded-2xl text-sm
                                   glass-strong text-white placeholder:text-white/25
                                   outline-none focus:border-violet-500/40
                                   transition-all duration-300"
                        >
                    </div>
                </div>
                <button
                    id="btn-search"
                    onclick="searchCoupon()"
                    class="px-7 py-4 rounded-2xl text-sm font-semibold
                           bg-gradient-to-r from-violet-600 to-indigo-600
                           hover:from-violet-500 hover:to-indigo-500
                           hover:shadow-xl hover:shadow-violet-500/25
                           active:scale-[0.96]
                           disabled:opacity-30 disabled:cursor-not-allowed
                           transition-all duration-300"
                >
                    조회
                </button>
            </div>
        </div>

        <!-- 결과 영역 -->
        <section id="result-section" style="display: none;">
            <div id="result-area"></div>
        </section>

        <!-- 빈 상태 -->
        <section id="empty-state" class="mt-20 text-center animate-fade-up" style="animation-delay: 0.2s;">
            <div class="animate-float">
                <div class="w-24 h-24 mx-auto mb-8 rounded-3xl glass flex items-center justify-center relative">
                    <span class="text-5xl">🎫</span>
                    <div class="absolute inset-0 rounded-3xl bg-gradient-to-br from-violet-500/10 to-transparent"></div>
                </div>
            </div>
            <p class="text-base text-white/25 leading-relaxed">
                사용자 ID를 검색하면<br>발급된 쿠폰 정보를 확인할 수 있어요
            </p>
            <div class="mt-6 flex justify-center gap-2">
                <button onclick="document.getElementById('user-id-input').value='user01';searchCoupon();" class="text-[11px] text-white/20 hover:text-violet-400 px-3 py-1.5 rounded-full glass hover:border-violet-500/30 transition-all cursor-pointer">user01</button>
                <button onclick="document.getElementById('user-id-input').value='user02';searchCoupon();" class="text-[11px] text-white/20 hover:text-violet-400 px-3 py-1.5 rounded-full glass hover:border-violet-500/30 transition-all cursor-pointer">user02</button>
                <button onclick="document.getElementById('user-id-input').value='user03';searchCoupon();" class="text-[11px] text-white/20 hover:text-violet-400 px-3 py-1.5 rounded-full glass hover:border-violet-500/30 transition-all cursor-pointer">user03</button>
            </div>
        </section>

    </div>

    <!-- 모달 -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center transition-opacity duration-300" style="display:none;">
        <div id="modal-box" class="animate-scale-in glass-strong rounded-3xl p-10 max-w-sm w-full mx-5 text-center shadow-2xl shadow-black/50">
            <div id="modal-icon" class="w-20 h-20 mx-auto mb-6 rounded-2xl flex items-center justify-center text-4xl"></div>
            <p id="modal-title" class="text-xl font-bold text-white/90 mb-2"></p>
            <p id="modal-desc" class="text-sm text-white/40 mb-8"></p>
            <button onclick="closeModal()" class="w-full px-6 py-3.5 rounded-2xl text-sm font-semibold bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 active:scale-[0.97] transition-all duration-200 shadow-lg shadow-violet-600/20">
                확인
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
