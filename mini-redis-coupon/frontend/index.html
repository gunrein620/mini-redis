<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini-redis — 선착순 쿠폰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        *, *::before, *::after { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', system-ui, sans-serif; background: #f0f6ff; color: #1a1a2e; margin: 0; }

        @keyframes fade-up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fade-up 0.8s cubic-bezier(0.25, 1, 0.5, 1) both; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.1); border-top-color: #0A84FF; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }

        /* 글래스 패널 (라이트) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        /* 터미널 윈도우 (라이트) */
        .terminal-window {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        /* 버튼 시스템 */
        .btn {
            border-radius: 980px;
            font-weight: 700;
            font-size: 15px;
            padding: 15px 28px;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid transparent;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        }
        .btn:hover::after { opacity: 1; }
        .btn:active { transform: translateY(-1px) scale(0.98); transition-duration: 0.1s; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06) !important; }
        .btn:disabled::after { opacity: 0 !important; }

        .btn-primary {
            background: rgba(255,255,255,0.82);
            color: #1a1a2e;
            border-color: rgba(15, 23, 42, 0.08);
        }
        .btn-primary::after { background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(200,220,255,0.2)); }
        .btn-primary:hover { background: rgba(255,255,255,0.98); border-color: rgba(15, 23, 42, 0.14); }

        .btn-secondary {
            background: rgba(255,255,255,0.82);
            color: #1a1a2e;
            border-color: rgba(15, 23, 42, 0.08);
        }
        .btn-secondary::after { background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(200,220,255,0.2)); }
        .btn-secondary:hover { background: rgba(255,255,255,0.98); border-color: rgba(15, 23, 42, 0.14); }

        .btn-soft-redis {
            background: rgba(220, 38, 38, 0.10);
            color: #b42318;
            border-color: rgba(220, 38, 38, 0.14);
            box-shadow: 0 10px 24px rgba(220, 38, 38, 0.08);
        }
        .btn-soft-redis::after { background: linear-gradient(135deg, rgba(220, 38, 38, 0.08), rgba(249, 115, 22, 0.06)); }
        .btn-soft-redis:hover {
            background: rgba(220, 38, 38, 0.16);
            border-color: rgba(220, 38, 38, 0.24);
            box-shadow: 0 16px 40px rgba(220, 38, 38, 0.16);
        }

        .btn-soft-db {
            background: rgba(37, 99, 235, 0.10);
            color: #1d4ed8;
            border-color: rgba(37, 99, 235, 0.14);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.08);
        }
        .btn-soft-db::after { background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(56, 189, 248, 0.06)); }
        .btn-soft-db:hover {
            background: rgba(37, 99, 235, 0.16);
            border-color: rgba(37, 99, 235, 0.24);
            box-shadow: 0 16px 40px rgba(37, 99, 235, 0.16);
        }

        .btn-reset {
            background: rgba(255,255,255,0.82);
            color: #475569;
            border-color: rgba(71, 85, 105, 0.16);
        }
        .btn-reset::after { background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(148,163,184,0.08)); }
        .btn-reset:hover {
            background: rgba(255,255,255,0.98);
            color: #334155;
            border-color: rgba(71, 85, 105, 0.28);
        }

        .btn-text {
            color: #0A84FF; font-weight: 600; font-size: 15px;
            background: none; border: none; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 4px 2px;
            border-radius: 8px;
        }
        .btn-text:hover {
            color: #006ee6;
            background: rgba(10, 132, 255, 0.06);
            padding: 4px 10px;
        }
        .btn-text:disabled { opacity: 0.35; cursor: not-allowed; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

        /* app.js 호환 클래스 (라이트) */
        .result-success { color: #22a352; font-weight: 600; }
        .result-fail { color: #e63939; font-weight: 600; }
        .result-info { color: #0A84FF; font-weight: 600; }
        .result-time { color: #d97706; font-size: 15px; margin-top: 8px; font-weight: 600; }
        .result-detail { color: #6b7280; font-size: 13px; margin-top: 10px; line-height: 1.7; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 10px; }

        .bulk-result { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bulk-column h3 { font-size: 17px; font-weight: 800; margin-bottom: 10px; color: #1a1a2e; }
        .bulk-column p { font-size: 14px; margin-bottom: 6px; color: #6b7280; }
        .bulk-summary { margin-top: 18px; padding: 16px 20px; background: rgba(217,119,6,0.08); border: 1px solid rgba(217,119,6,0.2); border-radius: 12px; text-align: center; font-size: 15px; color: #d97706; font-weight: 700; }
        .bulk-hero { margin-bottom: 18px; padding: 16px 18px; background: linear-gradient(135deg, rgba(10,132,255,0.08), rgba(56,189,248,0.12)); border: 1px solid rgba(10,132,255,0.12); border-radius: 14px; }
        .bulk-hero-label { font-size: 12px; color: #64748b; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
        .bulk-hero-value { margin-top: 6px; font-size: 26px; line-height: 1.2; font-weight: 800; color: #1a1a2e; }
        .bulk-hero-copy { margin-top: 6px; font-size: 14px; color: #64748b; }
        .bulk-chart { display: grid; gap: 18px; margin-top: 18px; }
        .bulk-chart-group { padding: 16px 18px; background: rgba(255,255,255,0.78); border: 1px solid rgba(15,23,42,0.06); border-radius: 14px; }
        .bulk-chart-title { margin-bottom: 12px; font-size: 13px; color: #475569; font-weight: 700; }
        .metric-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; }
        .metric-row + .metric-row { margin-top: 10px; }
        .metric-label { font-size: 13px; color: #64748b; font-weight: 700; }
        .metric-track { position: relative; height: 28px; background: rgba(148,163,184,0.16); border-radius: 999px; overflow: hidden; }
        .metric-fill { height: 100%; border-radius: 999px; }
        .metric-fill.redis { background: linear-gradient(90deg, #ef4444, #f97316); }
        .metric-fill.db { background: linear-gradient(90deg, #2563eb, #38bdf8); }
        .metric-value { font-size: 13px; color: #1a1a2e; font-weight: 700; min-width: 68px; text-align: right; }
        .bulk-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
        .bulk-stat-card { padding: 14px 12px; border-radius: 12px; background: rgba(255,255,255,0.78); border: 1px solid rgba(15,23,42,0.06); text-align: center; }
        .bulk-stat-label { font-size: 12px; color: #64748b; font-weight: 700; }
        .bulk-stat-values { margin-top: 8px; display: grid; gap: 4px; font-size: 13px; color: #334155; }
        .bulk-stat-values strong { font-weight: 800; }

        .coupon-list { max-height: 140px; overflow-y: auto; margin: 6px 0; }
        .coupon-item { font-size: 12px; padding: 3px 0; color: #6b7280; font-family: 'SF Mono', 'Menlo', monospace; }
        .ttl-badge { display: inline-block; background: rgba(10,132,255,0.1); color: #0A84FF; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-left: 4px; font-weight: 600; }

        .placeholder { color: #9ca3af; text-align: center; }

        /* 쿠폰 티켓 카드 */
        .ticket {
            position: relative;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        .ticket-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ticket-header-title { font-size: 15px; font-weight: 700; color: #22a352; }
        .ticket-header-badge {
            font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
            padding: 4px 10px; border-radius: 980px;
            background: rgba(34, 163, 82, 0.10); color: #22a352;
        }
        .ticket-header-badge.fail-badge {
            background: rgba(230, 57, 57, 0.10); color: #e63939;
        }
        .ticket-code-area {
            padding: 20px;
            text-align: center;
            border-top: 2px dashed rgba(0, 0, 0, 0.06);
            border-bottom: 2px dashed rgba(0, 0, 0, 0.06);
            position: relative;
        }
        .ticket-notch {
            position: absolute; width: 24px; height: 24px;
            background: #f0f6ff; border-radius: 50%;
        }
        .ticket-notch-left { left: -12px; top: 50%; transform: translateY(-50%); }
        .ticket-notch-right { right: -12px; top: 50%; transform: translateY(-50%); }
        .ticket-code {
            font-size: 22px; font-weight: 800; color: #1a1a2e;
            letter-spacing: 0.04em;
        }
        .ticket-code-sub {
            margin-top: 4px; font-size: 12px; color: #9ca3af; font-weight: 600;
        }
        .ticket-details {
            padding: 16px 20px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .ticket-detail-item {}
        .ticket-detail-label {
            font-size: 11px; font-weight: 700; color: #9ca3af;
            letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px;
        }
        .ticket-detail-value { font-size: 15px; font-weight: 700; color: #1a1a2e; }
        .ticket-footer {
            padding: 12px 20px 16px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }
        .ticket-elapsed { font-size: 13px; font-weight: 700; color: #d97706; }
        .ticket-validate-btn {
            font-size: 13px; font-weight: 700; color: #0A84FF;
            background: rgba(10, 132, 255, 0.08); border: 1px solid rgba(10, 132, 255, 0.12);
            border-radius: 980px; padding: 8px 16px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .ticket-validate-btn:hover {
            background: rgba(10, 132, 255, 0.16);
            border-color: rgba(10, 132, 255, 0.28);
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.18);
            transform: translateY(-2px);
        }
        .ticket-validate-btn:active { transform: translateY(0) scale(0.97); }

        .log-item { padding: 12px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .log-item:last-child { border-bottom: none; }
        .log-item .log-msg { flex: 1; color: #6b7280; }
        .log-item .log-time { color: #d97706; font-size: 13px; white-space: nowrap; margin-left: 10px; font-family: 'SF Mono', monospace; font-weight: 600; }
        .log-item.success .log-msg { color: #22a352; }
        .log-item.fail .log-msg { color: #e63939; }
        .log-item.info .log-msg { color: #0A84FF; }

        @media (max-width: 480px) {
            .bulk-result { grid-template-columns: 1fr; }
            .bulk-stats { grid-template-columns: 1fr; }
            .metric-row { grid-template-columns: 64px 1fr auto; gap: 10px; }
            .bulk-hero-value { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="relative max-w-[680px] mx-auto px-6">

        <!-- 히어로 -->
        <section class="pt-24 pb-16 text-center fade-up">
            <p class="text-[#0A84FF] text-sm font-semibold tracking-wide mb-4">Mini Redis Project</p>
            <h1 class="text-5xl sm:text-6xl font-bold tracking-tight leading-[1.08] text-[#1a1a2e] mb-5">
                잡아봐라! 쿠폰<br>
                <span class="bg-gradient-to-r from-[#0A84FF] to-[#38bdf8] bg-clip-text text-transparent">빠르게, 안전하게.</span>
            </h1>
            <p class="text-lg text-[#6b7280] leading-relaxed max-w-md mx-auto">
                Redis의 atomic 연산과 PostgreSQL의 행 잠금을<br>같은 조건에서 비교합니다.
            </p>
        </section>

        <!-- 재고 현황 -->
        <section class="mb-8 fade-up" style="animation-delay: 0.1s;">
            <div class="glass-panel">
                <div class="p-6 text-center">
                    <div class="text-xs font-semibold text-[#6b7280] tracking-[0.2em] mb-3">
                        남은 쿠폰 갯수
                    </div>
                    <span class="text-4xl font-bold text-[#1a1a2e] tabular-nums tracking-tight" id="redis-count">—</span>
                    <span id="coupon-count" class="hidden"></span>
                    <span id="db-count" class="hidden"></span>
                </div>
            </div>
        </section>

        <!-- 액션 버튼 그룹 -->
        <section class="mb-8 fade-up" style="animation-delay: 0.15s;">
            <div class="flex flex-col gap-3">
                <div class="grid grid-cols-2 gap-3">
                    <button class="btn btn-soft-redis flex items-center justify-center gap-2" id="btn-redis" onclick="issueCouponRedis()">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/redis/redis-original.svg" class="w-4 h-4" alt="">
                        Redis 발급
                    </button>
                    <button class="btn btn-secondary flex items-center justify-center gap-2" id="btn-db" onclick="issueCouponDB()">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg" class="w-4 h-4" alt="">
                        DB 발급
                    </button>
                </div>
                <button class="btn btn-secondary flex items-center justify-center gap-2 w-full" id="btn-bulk" onclick="bulkTest()">
                    1000명 동시 테스트
                </button>
                <div class="grid grid-cols-2 gap-3">
                    <button class="btn btn-secondary flex items-center justify-center gap-2 w-full" id="btn-query" onclick="queryValidCoupons()">
                        유효 쿠폰 조회
                    </button>
                    <button class="btn btn-reset flex items-center justify-center gap-2 w-full" id="btn-reset" onclick="resetCoupon()">
                        재고 초기화
                    </button>
                </div>
            </div>
        </section>

        <!-- 결과: 터미널 윈도우 -->
        <section class="mb-8 fade-up" style="animation-delay: 0.2s;">
            <div class="terminal-window">
                <div class="flex items-center justify-center px-4 py-3 border-b border-black/[0.06]">
                    <span class="text-xs text-[#9ca3af] font-medium">결과</span>
                </div>
                <div class="p-5 min-h-[80px] text-[15px]" id="result-box">
                    <p class="placeholder py-3 font-sans">버튼을 클릭하여 테스트해보세요</p>
                </div>
            </div>
        </section>

        <!-- 로그: 터미널 윈도우 -->
        <section class="mb-12 fade-up" style="animation-delay: 0.25s;">
            <div class="terminal-window">
                <div class="flex items-center justify-center px-4 py-3 border-b border-black/[0.06]">
                    <span class="text-xs text-[#9ca3af] font-medium">요청 기록 <span id="log-count">(0/10)</span></span>
                </div>
                <div class="px-5 py-2 max-h-[240px] overflow-y-auto" id="log-list">
                    <p class="placeholder py-4 font-sans text-sm">아직 요청 기록이 없습니다</p>
                </div>
            </div>
        </section>

        <!-- 네비게이션 -->
        <div class="flex justify-center gap-8 pb-16 fade-up" style="animation-delay: 0.3s;">
            <a href="./mc-frontend/" class="btn-text inline-flex items-center gap-1.5 text-base">
                쿠폰 TTL 데모
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>
            <a href="./gw-frontend/" class="btn-text inline-flex items-center gap-1.5 text-base">
                DBMS 데모
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>
        </div>

    </div>
    <script src="app.js?v=4"></script>
</body>
</html>
