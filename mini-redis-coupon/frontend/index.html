<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini-redis — 선착순 쿠폰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        *, *::before, *::after { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', system-ui, sans-serif; background: #f0f6ff; color: #1a1a2e; margin: 0; }

        @keyframes fade-up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fade-up 0.8s cubic-bezier(0.25, 1, 0.5, 1) both; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.1); border-top-color: #0A84FF; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }

        /* 글래스 패널 (라이트) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        /* 터미널 윈도우 (라이트) */
        .terminal-window {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        /* Apple 스타일 버튼 */
        .btn-primary { background: #0A84FF; color: #fff; border-radius: 980px; font-weight: 600; font-size: 15px; padding: 12px 28px; transition: all 0.2s; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(10,132,255,0.3); }
        .btn-primary:hover { background: #409CFF; box-shadow: 0 6px 20px rgba(10,132,255,0.4); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        .btn-secondary { background: rgba(255,255,255,0.6); color: #1a1a2e; border-radius: 980px; font-weight: 600; font-size: 15px; padding: 12px 28px; transition: all 0.2s; border: 1px solid rgba(0,0,0,0.08); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn-secondary:hover { background: rgba(255,255,255,0.8); }
        .btn-secondary:active { transform: scale(0.97); }
        .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        .btn-text { color: #0A84FF; font-weight: 600; font-size: 15px; background: none; border: none; cursor: pointer; transition: color 0.2s; }
        .btn-text:hover { color: #006ee6; }
        .btn-text:disabled { opacity: 0.35; cursor: not-allowed; }

        /* 트래픽 라이트 */
        .traffic-light { width: 12px; height: 12px; border-radius: 50%; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

        /* app.js 호환 클래스 (라이트) */
        .result-success { color: #22a352; font-weight: 600; }
        .result-fail { color: #e63939; font-weight: 600; }
        .result-info { color: #0A84FF; font-weight: 600; }
        .result-time { color: #d97706; font-size: 14px; margin-top: 6px; }
        .result-detail { color: #6b7280; font-size: 12px; margin-top: 8px; line-height: 1.6; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 8px; }

        .bulk-result { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bulk-column h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: #1a1a2e; }
        .bulk-column p { font-size: 13px; margin-bottom: 3px; color: #6b7280; }
        .bulk-summary { margin-top: 16px; padding: 14px 20px; background: rgba(217,119,6,0.08); border: 1px solid rgba(217,119,6,0.2); border-radius: 12px; text-align: center; font-size: 14px; color: #d97706; font-weight: 600; }

        .coupon-list { max-height: 140px; overflow-y: auto; margin: 6px 0; }
        .coupon-item { font-size: 12px; padding: 3px 0; color: #6b7280; font-family: 'SF Mono', 'Menlo', monospace; }
        .ttl-badge { display: inline-block; background: rgba(10,132,255,0.1); color: #0A84FF; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-left: 4px; font-weight: 600; }

        .placeholder { color: #9ca3af; text-align: center; }

        .log-item { padding: 10px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .log-item:last-child { border-bottom: none; }
        .log-item .log-msg { flex: 1; color: #6b7280; }
        .log-item .log-time { color: #d97706; font-size: 12px; white-space: nowrap; margin-left: 8px; font-family: 'SF Mono', monospace; }
        .log-item.success .log-msg { color: #22a352; }
        .log-item.fail .log-msg { color: #e63939; }
        .log-item.info .log-msg { color: #0A84FF; }

        @media (max-width: 480px) { .bulk-result { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="relative max-w-[680px] mx-auto px-6">

        <!-- 히어로 -->
        <section class="pt-24 pb-16 text-center fade-up">
            <p class="text-[#0A84FF] text-sm font-semibold tracking-wide mb-4">Mini Redis Project</p>
            <h1 class="text-5xl sm:text-6xl font-bold tracking-tight leading-[1.08] text-[#1a1a2e] mb-5">
                선착순 쿠폰.<br>
                <span class="bg-gradient-to-r from-[#0A84FF] to-[#38bdf8] bg-clip-text text-transparent">빠르게, 안전하게.</span>
            </h1>
            <p class="text-lg text-[#6b7280] leading-relaxed max-w-md mx-auto">
                Redis의 atomic 연산과 PostgreSQL의 행 잠금을<br>같은 조건에서 비교합니다.
            </p>
        </section>

        <!-- 재고 현황 -->
        <section class="mb-8 fade-up" style="animation-delay: 0.1s;">
            <div class="glass-panel grid grid-cols-2">
                <div class="p-6 text-center">
                    <div class="flex items-center justify-center gap-2 mb-3">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/redis/redis-original.svg" class="w-5 h-5" alt="">
                        <span class="text-xs font-semibold text-[#6b7280] uppercase tracking-wider">Redis</span>
                    </div>
                    <span class="text-4xl font-bold text-[#1a1a2e] tabular-nums tracking-tight" id="redis-count">—</span>
                </div>
                <div class="p-6 text-center border-l border-black/[0.06]">
                    <div class="flex items-center justify-center gap-2 mb-3">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg" class="w-5 h-5" alt="">
                        <span class="text-xs font-semibold text-[#6b7280] uppercase tracking-wider">PostgreSQL</span>
                    </div>
                    <span class="text-4xl font-bold text-[#1a1a2e] tabular-nums tracking-tight" id="db-count">—</span>
                </div>
            </div>
        </section>

        <!-- 액션 버튼 그룹 -->
        <section class="mb-8 fade-up" style="animation-delay: 0.15s;">
            <div class="flex flex-col gap-3">
                <div class="grid grid-cols-2 gap-3">
                    <button class="btn btn-primary flex items-center justify-center gap-2" id="btn-redis" onclick="issueCouponRedis()">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/redis/redis-original.svg" class="w-4 h-4 brightness-0 invert" alt="">
                        Redis 발급
                    </button>
                    <button class="btn btn-secondary flex items-center justify-center gap-2" id="btn-db" onclick="issueCouponDB()">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg" class="w-4 h-4 brightness-0 invert" alt="">
                        DB 발급
                    </button>
                </div>
                <button class="btn btn-secondary flex items-center justify-center gap-2 w-full" id="btn-bulk" onclick="bulkTest()">
                    1000명 동시 테스트
                </button>
                <div class="grid grid-cols-2 gap-3">
                    <button class="btn btn-secondary flex items-center justify-center gap-2 w-full" id="btn-query" onclick="queryValidCoupons()">
                        유효 쿠폰 조회
                    </button>
                    <button class="btn btn-text flex items-center justify-center gap-2 w-full" id="btn-reset" onclick="resetCoupon()">
                        재고 초기화
                    </button>
                </div>
            </div>
        </section>

        <!-- 결과: 터미널 윈도우 -->
        <section class="mb-8 fade-up" style="animation-delay: 0.2s;">
            <div class="terminal-window">
                <!-- 트래픽 라이트 -->
                <div class="flex items-center gap-2 px-4 py-3 border-b border-black/[0.06]">
                    <div class="traffic-light bg-[#FF5F57]"></div>
                    <div class="traffic-light bg-[#FEBC2E]"></div>
                    <div class="traffic-light bg-[#28C840]"></div>
                    <span class="flex-1 text-center text-xs text-[#9ca3af] font-medium -ml-14">결과</span>
                </div>
                <div class="p-5 min-h-[80px] font-mono text-sm" id="result-box">
                    <p class="placeholder py-3 font-sans">버튼을 클릭하여 테스트해보세요</p>
                </div>
            </div>
        </section>

        <!-- 로그: 터미널 윈도우 -->
        <section class="mb-12 fade-up" style="animation-delay: 0.25s;">
            <div class="terminal-window">
                <div class="flex items-center gap-2 px-4 py-3 border-b border-black/[0.06]">
                    <div class="traffic-light bg-[#FF5F57]"></div>
                    <div class="traffic-light bg-[#FEBC2E]"></div>
                    <div class="traffic-light bg-[#28C840]"></div>
                    <span class="flex-1 text-center text-xs text-[#9ca3af] font-medium -ml-14">요청 기록 <span id="log-count">(0/10)</span></span>
                </div>
                <div class="px-5 py-2 max-h-[240px] overflow-y-auto" id="log-list">
                    <p class="placeholder py-4 font-sans text-sm">아직 요청 기록이 없습니다</p>
                </div>
            </div>
        </section>

        <!-- 네비게이션 -->
        <div class="text-center pb-16 fade-up" style="animation-delay: 0.3s;">
            <a href="./mc-frontend/" class="btn-text inline-flex items-center gap-1.5 text-base">
                쿠폰 TTL 데모
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>
        </div>

    </div>
    <script src="app.js?v=2"></script>
</body>
</html>
